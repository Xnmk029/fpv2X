plugins {
	id 'fabric-loom' version '1.5-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group



base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
//	maven { url 'https://maven.wispforest.io' }
}

loom {
    splitEnvironmentSourceSets()

	mods {
		"fpv20" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration()
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

//	annotationProcessor modImplementation("io.wispforest:owo-lib:${project.owo_version}")
//	modImplementation "io.wispforest:owo-lib:${project.owo_version}"
//	include "io.wispforest:owo-sentinel:${project.owo_version}"
}

processResources {
	inputs.property "version", project.version
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

def getNextVersion(String currentVersion, String updateType) {
    def matcher = (currentVersion =~ /(\d+\.\d+\.\d+)(?:_([A-Z]))?/)
    if (matcher.matches()) {
        def baseNumber = matcher.group(1)
        def suffix = matcher.group(2)

        if (updateType == 'major') {
            def parts = baseNumber.split('\\.')
            int lastDigit = Integer.parseInt(parts[2]) + 1
            return "${parts[0]}.${parts[1]}.${lastDigit}"
        } else if (updateType == 'small') {
            if (suffix == null) {
                return "${baseNumber}_A"
            } else {
                char suffixChar = suffix.charAt(0)
                if (suffixChar == 'Z') {
                    def parts = baseNumber.split('\\.')
                    int lastDigit = Integer.parseInt(parts[2]) + 1
                    return "${parts[0]}.${parts[1]}.${lastDigit}_A"
                } else {
                    char nextSuffixChar = (char)(suffixChar + 1)
                    return "${baseNumber}_${nextSuffixChar}"
                }
            }
        }
    }
    return currentVersion
}

task autoIncrementVersion {
    doFirst {
        if (project.hasProperty('update') && project.property('update') == 'none') {
            println ">>> FPV2X Auto-Versioning: Skipping version increment (-Pupdate=none) <<<"
            return
        }

        def updateType = 'small'
        if (project.hasProperty('update') && project.property('update') == 'major') {
            updateType = 'major'
        }

        def propsFile = file('gradle.properties')
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }

        def currentVer = props.getProperty('mod_version', '0.0.1')
        def nextVer = getNextVersion(currentVer, updateType)

        props.setProperty('mod_version', nextVer)
        propsFile.withOutputStream { props.store(it, null) }

        project.version = nextVer
        println ">>> FPV2X Auto-Versioning: mod_version updated from ${currentVer} to ${nextVer} <<<"
    }
}

processResources.dependsOn autoIncrementVersion
compileJava.dependsOn autoIncrementVersion

jar {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

tasks.withType(AbstractCopyTask).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

remapJar {
	archiveFileName = provider { "FPV2X_${project.version}.jar" }
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

